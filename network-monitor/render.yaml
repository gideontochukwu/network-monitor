services:
  - type: web
    name: network-monitor
    runtime: python
    rootDir: .
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: |
      python backend/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - requirements.txt
    plan: free