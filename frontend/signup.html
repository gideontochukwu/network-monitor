<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Network Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e0a, #122a1a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-container {
            background: #111a14;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            width: 380px;
            border: 1px solid #1a2a1a;
        }

        .signup-container h1 {
            text-align: center;
            color: #d0f0d0;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .signup-container h1 span {
            color: #2ecc71;
        }

        .signup-container .subtitle {
            text-align: center;
            color: #3a5a3a;
            font-size: 13px;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #6f9f6f;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #1a2a1a;
            border-radius: 8px;
            font-size: 14px;
            background: #0a0e0a;
            color: #d0f0d0;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2ecc71;
        }

        .form-group input::placeholder {
            color: #2a3a2a;
        }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: #2ecc71;
            color: #0a0e0a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-signup:hover {
            background: #27ae60;
            transform: translateY(-1px);
        }

        .btn-signup:active {
            transform: translateY(0px);
        }

        .error {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            background: rgba(231, 76, 60, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .success {
            color: #2ecc71;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            background: rgba(46, 204, 113, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }

        .info {
            text-align: center;
            color: #3a5a3a;
            font-size: 13px;
            margin-top: 18px;
        }

        .info a {
            color: #2ecc71;
            text-decoration: none;
        }

        .info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>🌐 Network <span>Monitor</span></h1>
        <div class="subtitle">CREATE ACCOUNT</div>

        {% if error %}
        <div class="error">❌ {{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success">✅ {{ success }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="btn-signup">Create Account</button>
        </form>

        <div class="info">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>
</body>
</html>
