<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Network Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(ellipse at top, #0d1a0f, #0a0e0a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #111a14;
            padding: 45px 40px 35px 40px;
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
            width: 380px;
            border: 1px solid #1a3a2a;
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-3px);
        }

        .login-container .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .login-container .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #d0f0d0;
            letter-spacing: 1px;
        }

        .login-container .logo h1 span {
            color: #2ecc71;
        }

        .login-container .subtitle {
            text-align: center;
            color: #3a5a3a;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #6f9f6f;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #1a3a2a;
            border-radius: 10px;
            font-size: 14px;
            background: #0a0e0a;
            color: #d0f0d0;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.15);
        }

        .form-group input::placeholder {
            color: #2a3a2a;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2ecc71;
            color: #0a0e0a;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.25);
        }

        .btn-login:active {
            transform: translateY(0px);
        }

        .error {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            background: rgba(231, 76, 60, 0.08);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(231, 76, 60, 0.15);
        }

        .success {
            color: #2ecc71;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            background: rgba(46, 204, 113, 0.08);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(46, 204, 113, 0.15);
        }

        .info {
            text-align: center;
            color: #3a5a3a;
            font-size: 13px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #1a2a1a;
        }

        .info a {
            color: #2ecc71;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .info a:hover {
            color: #27ae60;
            text-decoration: underline;
        }

        .info .demo {
            color: #2a4a2a;
            font-size: 12px;
            margin-top: 5px;
        }

        .info .demo strong {
            color: #4a7a4a;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 30px 20px 25px 20px;
            }
            .login-container .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🌐 Network<span>Monitor</span></h1>
        </div>
        <div class="subtitle">REAL-TIME DASHBOARD</div>

        {% if error %}
        <div class="error">❌ {{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success">✅ {{ success }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="info">
            Don't have an account? <a href="/signup">Sign Up</a>
            <div class="demo">Default: <strong>admin</strong> / <strong>admin123</strong></div>
        </div>
    </div>
</body>
</html>
